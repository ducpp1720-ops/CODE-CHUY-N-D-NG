name: Lab2 validation

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python data/raw/generate_dataset.py
      - run: python eda/eda.py
      - run: python feature_engineering/feature_engineering.py
      - run: python modeling/train_models.py
      - run: python tests/smoke_test.py
